<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      internal/webui rewrites this placeholder to the request's resolved
      base path (web.base_path config, falling back to X-Forwarded-Prefix,
      falling back to "/") on every request that serves this document.
      Static assets are never rewritten. See SPEC.md §3.4.
    -->
    <base href="__MAELSINK_BASE_HREF__" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>maelsink — local SMTP sink for dev &amp; CI</title>
    <meta
      name="description"
      content="maelsink accepts any mail over SMTP and lets you inspect it in a web UI, without relaying anywhere — a fake mail server for local development and CI."
    />
    <meta name="theme-color" content="#635bff" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="maelsink — local SMTP sink for dev &amp; CI" />
    <meta
      property="og:description"
      content="Accepts any mail over SMTP and lets you inspect it in a web UI, without relaying anywhere."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Populated by the same server-side rewrite as <base href> above, so
      // the frontend's API/WS client never has to guess or hardcode "/".
      window.__MAELSINK_BASE__ = "__MAELSINK_BASE_PATH__";
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
